version: 2

project_name: kcm

before:
  hooks:
    - go mod tidy

builds:
  - id: kcm
    main: ./cmd/kcm
    binary: kcm
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.Version={{.Version}}
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - id: kcm
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    files:
      - README.md
      - CHANGELOG.md

checksum:
  name_template: "checksums.txt"

brews:
  - name: kcm
    repository:
      owner: odhomane
      name: homebrew-tap
    description: "Lightweight Kubernetes kubeconfig manager — CLI, TUI, and web dashboard"
    homepage: "https://github.com/odhomane/kcm"
    license: "MIT"
    install: |
      bin.install "kcm"
    test: |
      system "#{bin}/kcm", "version"

release:
  github:
    owner: odhomane
    name: kcm
  name_template: "v{{.Version}}"
  draft: false
  prerelease: auto

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge pull request"
      - "Merge branch"
