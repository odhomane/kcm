<!DOCTYPE html>
<html lang="en" class="dark" x-data="app()" x-init="init()">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{.Title}}</title>
  <link rel="stylesheet" href="/static/style.css" />
  <script src="/static/alpine.min.js" defer></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex flex-col font-mono">

<!-- Top bar -->
<header class="bg-gray-900 border-b border-gray-800 px-4 py-3 flex items-center gap-4">
  <span class="text-blue-400 font-bold text-lg">⎈ kcm</span>
  <span class="text-gray-500 text-sm">Kubeconfig Manager</span>

  <div class="ml-auto flex items-center gap-3">
    <!-- Quick search trigger -->
    <button @click="showSearch = true"
            class="text-sm text-gray-400 border border-gray-700 rounded px-3 py-1 hover:border-blue-500 flex items-center gap-2">
      <span>Search contexts</span>
      <kbd class="text-xs text-gray-600">⌘K</kbd>
    </button>

    <!-- Current context badge -->
    <template x-if="currentCtx">
      <span class="text-xs bg-blue-900 text-blue-200 px-2 py-1 rounded" x-text="currentCtx"></span>
    </template>
  </div>
</header>

<div class="flex flex-1 overflow-hidden">

  <!-- Sidebar -->
  <aside class="w-56 bg-gray-900 border-r border-gray-800 flex flex-col shrink-0">
    <nav class="p-3 space-y-1 flex-1 overflow-y-auto">
      <p class="text-xs text-gray-600 uppercase tracking-wider mb-2">Files</p>
      <template x-for="f in files" :key="f.path">
        <button @click="filterFile = (filterFile === f.path ? '' : f.path)"
                :class="filterFile === f.path ? 'bg-blue-900 text-blue-200' : 'text-gray-400 hover:bg-gray-800'"
                class="w-full text-left text-xs px-2 py-1.5 rounded truncate block"
                :title="f.path">
          <span x-text="shortPath(f.path)"></span>
          <span class="text-gray-600 ml-1" x-text="'(' + f.contexts + ')'"></span>
        </button>
      </template>

      <p class="text-xs text-gray-600 uppercase tracking-wider mt-4 mb-2">Groups</p>
      <template x-for="g in groupList" :key="g">
        <button @click="filterGroup = (filterGroup === g ? '' : g)"
                :class="filterGroup === g ? 'bg-blue-900 text-blue-200' : 'text-gray-400 hover:bg-gray-800'"
                class="w-full text-left text-xs px-2 py-1.5 rounded">
          <span x-text="g"></span>
        </button>
      </template>

      <p class="text-xs text-gray-600 uppercase tracking-wider mt-4 mb-2">Pinned</p>
      <template x-for="c in pinned" :key="c.name">
        <button @click="switchCtx(c.name)"
                class="w-full text-left text-xs px-2 py-1.5 rounded text-yellow-400 hover:bg-gray-800 truncate"
                x-text="c.name"></button>
      </template>
    </nav>
  </aside>

  <!-- Main content -->
  <main class="flex-1 overflow-auto p-6">

    <!-- Filter bar -->
    <div class="flex items-center gap-3 mb-4">
      <input x-model="search"
             @input.debounce.200ms="loadContexts()"
             class="bg-gray-800 border border-gray-700 rounded px-3 py-1.5 text-sm flex-1 max-w-sm focus:outline-none focus:border-blue-500"
             placeholder="Filter contexts..." />
      <label class="flex items-center gap-1.5 text-xs text-gray-400">
        <input type="checkbox" x-model="pinnedOnly" @change="loadContexts()" class="accent-yellow-400" />
        Pinned only
      </label>
      <span class="text-xs text-gray-600" x-text="contexts.length + ' contexts'"></span>
    </div>

    <!-- Context table -->
    <div class="bg-gray-900 rounded-lg border border-gray-800 overflow-hidden">
      <table class="w-full text-sm">
        <thead>
          <tr class="border-b border-gray-800 text-xs text-gray-500 uppercase">
            <th class="px-4 py-2 text-left">Name</th>
            <th class="px-4 py-2 text-left">Cluster</th>
            <th class="px-4 py-2 text-left">Namespace</th>
            <th class="px-4 py-2 text-left">Group</th>
            <th class="px-4 py-2 text-left">Cloud</th>
            <th class="px-4 py-2 text-left">Last Used</th>
            <th class="px-4 py-2 text-right">Actions</th>
          </tr>
        </thead>
        <tbody>
          <template x-for="c in contexts" :key="c.name">
            <tr @click="openDetail(c)"
                :class="c.current ? 'bg-blue-950' : 'hover:bg-gray-800'"
                class="border-b border-gray-800/50 cursor-pointer transition-colors">
              <td class="px-4 py-2.5">
                <span class="text-green-400 mr-1" x-show="c.current">✔</span>
                <span class="text-yellow-400 mr-1" x-show="c.pinned">★</span>
                <span :class="c.color ? 'text-' + c.color + '-300' : 'text-gray-100'" x-text="c.name"></span>
              </td>
              <td class="px-4 py-2.5 text-gray-400 text-xs truncate max-w-32" x-text="c.cluster"></td>
              <td class="px-4 py-2.5 text-gray-400 text-xs" x-text="c.namespace || '—'"></td>
              <td class="px-4 py-2.5">
                <template x-if="c.group">
                  <span class="text-xs bg-gray-800 text-blue-300 px-1.5 py-0.5 rounded" x-text="c.group"></span>
                </template>
              </td>
              <td class="px-4 py-2.5 text-xs text-gray-500">
                <span x-text="c.cloudProvider ? (c.cloudProvider + (c.cloudRegion ? ' / ' + c.cloudRegion : '')) : ''"></span>
              </td>
              <td class="px-4 py-2.5 text-xs text-gray-600" x-text="c.lastUsed ? fmtDate(c.lastUsed) : '—'"></td>
              <td class="px-4 py-2.5 text-right">
                <div class="flex items-center justify-end gap-1" @click.stop>
                  <button @click="switchCtx(c.name)"
                          class="text-xs px-2 py-1 bg-blue-800 hover:bg-blue-700 rounded transition-colors"
                          title="Switch context">Use</button>
                  <button @click="openDetail(c)"
                          class="text-xs px-2 py-1 bg-gray-700 hover:bg-gray-600 rounded transition-colors"
                          title="View details">···</button>
                </div>
              </td>
            </tr>
          </template>
          <tr x-show="contexts.length === 0">
            <td colspan="7" class="px-4 py-8 text-center text-gray-600">
              No contexts found. Try adjusting your filters or
              <button @click="search=''; filterGroup=''; loadContexts()" class="text-blue-400 underline">clear filters</button>.
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>

  <!-- Detail drawer -->
  <aside x-show="selected"
         x-transition:enter="transition ease-out duration-200"
         x-transition:enter-start="translate-x-full"
         x-transition:enter-end="translate-x-0"
         x-transition:leave="transition ease-in duration-150"
         x-transition:leave-start="translate-x-0"
         x-transition:leave-end="translate-x-full"
         class="w-96 bg-gray-900 border-l border-gray-800 overflow-y-auto flex flex-col shrink-0">
    <template x-if="selected">
      <div class="p-4">
        <div class="flex items-start justify-between mb-4">
          <h2 class="font-bold text-base" x-text="selected.name"></h2>
          <button @click="selected = null" class="text-gray-600 hover:text-gray-300 text-lg leading-none">✕</button>
        </div>

        <!-- Detail fields -->
        <dl class="space-y-2 text-sm">
          <template x-for="[k,v] in detailFields()" :key="k">
            <div class="flex gap-2">
              <dt class="text-gray-500 w-24 shrink-0" x-text="k + ':'"></dt>
              <dd class="text-gray-200 break-all" x-text="v"></dd>
            </div>
          </template>
        </dl>

        <!-- Actions -->
        <div class="mt-6 space-y-2">
          <button @click="switchCtx(selected.name)"
                  class="w-full text-sm py-2 bg-blue-700 hover:bg-blue-600 rounded transition-colors">
            Switch to this context
          </button>

          <div class="flex gap-2">
            <button @click="promptRename()"
                    class="flex-1 text-sm py-2 bg-gray-700 hover:bg-gray-600 rounded transition-colors">
              Rename
            </button>
            <button @click="exportCtx(selected.name)"
                    class="flex-1 text-sm py-2 bg-gray-700 hover:bg-gray-600 rounded transition-colors">
              Export
            </button>
            <button @click="togglePin()"
                    :class="selected.pinned ? 'text-yellow-300 bg-yellow-900/30' : 'bg-gray-700'"
                    class="text-sm py-2 px-3 hover:bg-gray-600 rounded transition-colors">
              ★
            </button>
          </div>

          <div class="flex gap-2 items-center mt-2">
            <input x-model="groupInput" class="flex-1 text-xs bg-gray-800 border border-gray-700 rounded px-2 py-1.5 focus:outline-none focus:border-blue-500" placeholder="Set group..." />
            <button @click="setGroup()" class="text-xs px-3 py-1.5 bg-gray-700 hover:bg-gray-600 rounded">Set</button>
          </div>

          <button @click="deleteCtx(selected.name)"
                  class="w-full text-sm py-2 bg-red-900/40 hover:bg-red-800 text-red-300 rounded transition-colors mt-4">
            Delete context
          </button>
        </div>
      </div>
    </template>
  </aside>
</div>

<!-- Quick search modal -->
<div x-show="showSearch"
     @keydown.escape.window="showSearch = false"
     class="fixed inset-0 bg-black/70 flex items-start justify-center pt-24 z-50">
  <div class="w-full max-w-lg bg-gray-900 rounded-lg border border-gray-700 shadow-2xl overflow-hidden" @click.stop>
    <input x-model="quickSearch"
           x-ref="quickInput"
           @input="filterQuick()"
           class="w-full bg-transparent px-4 py-3 text-base focus:outline-none border-b border-gray-700"
           placeholder="Search contexts..." />
    <ul class="max-h-80 overflow-y-auto">
      <template x-for="c in quickResults" :key="c.name">
        <li @click="switchCtx(c.name); showSearch = false"
            class="px-4 py-2.5 hover:bg-gray-800 cursor-pointer flex items-center gap-2 text-sm">
          <span class="text-green-400" x-show="c.current">✔</span>
          <span x-text="c.name" class="flex-1"></span>
          <span class="text-xs text-gray-500" x-text="c.cluster"></span>
        </li>
      </template>
    </ul>
  </div>
</div>

<!-- Notification toast -->
<div x-show="toast"
     x-transition
     class="fixed bottom-4 right-4 bg-gray-800 border border-gray-700 text-sm px-4 py-2 rounded shadow-lg"
     x-text="toast"></div>

<script src="/static/app.js"></script>
</body>
</html>
