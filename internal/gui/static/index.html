<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{.Title}}</title>
  <link rel="stylesheet" href="/static/style.css" />
  <script src="/static/alpine.min.js" defer></script>
</head>
<body x-data="app()" x-init="init()" @keydown.meta.k.window.prevent="openSearch()" @keydown.ctrl.k.window.prevent="openSearch()" @keydown.escape.window="closeAll()">

<div class="layout">

  <!-- ── Top bar ─────────────────────────────────────────────────────────── -->
  <header class="topbar">
    <a class="topbar-brand" href="#">
      <div class="logo-icon">⎈</div>
      <span>kcm</span>
    </a>

    <div class="topbar-divider"></div>

    <!-- Quick search trigger -->
    <div class="topbar-search" @click="openSearch()">
      <span class="filter-icon">🔍</span>
      <input readonly placeholder="Search contexts..." />
      <span class="search-kbd">⌘K</span>
    </div>

    <div class="topbar-right">
      <!-- Current context badge -->
      <div class="ctx-badge" x-show="currentCtx" x-cloak>
        <span class="dot"></span>
        <span class="truncate" x-text="currentCtx" style="max-width:220px"></span>
      </div>

      <!-- Theme toggle -->
      <button class="theme-btn" @click="toggleTheme()" :title="theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'">
        <span x-text="theme === 'dark' ? '☀️' : '🌙'"></span>
      </button>
    </div>
  </header>

  <!-- ── Sidebar ─────────────────────────────────────────────────────────── -->
  <aside class="sidebar">
    <p class="sidebar-section-label">Kubeconfigs</p>
    <template x-for="f in files" :key="f.path">
      <div class="sidebar-item"
           :class="filterFile === f.path ? 'active' : ''"
           @click="filterFile = filterFile === f.path ? '' : f.path; loadContexts()">
        <span class="icon">📄</span>
        <span class="truncate" :title="f.path" x-text="shortPath(f.path)" style="flex:1"></span>
        <span class="badge" x-text="f.contexts"></span>
      </div>
    </template>

    <p class="sidebar-section-label" x-show="groupList.length > 0">Groups</p>
    <template x-for="g in groupList" :key="g">
      <div class="sidebar-item"
           :class="filterGroup === g ? 'active' : ''"
           @click="filterGroup = filterGroup === g ? '' : g; loadContexts()">
        <span class="icon">🗂</span>
        <span x-text="g" style="flex:1"></span>
        <span class="badge" x-text="groupCount(g)"></span>
      </div>
    </template>

    <p class="sidebar-section-label" x-show="pinned.length > 0">Pinned</p>
    <template x-for="c in pinned" :key="c.name">
      <div class="sidebar-item" @click="switchCtx(c.name)" :title="c.name">
        <span class="icon">⭐</span>
        <span class="truncate" x-text="c.name" style="flex:1;font-family:var(--font-mono);font-size:11px"></span>
      </div>
    </template>
  </aside>

  <!-- ── Main content ────────────────────────────────────────────────────── -->
  <main class="main">
    <div class="page-header">
      <h1 class="page-title">Contexts</h1>
      <span class="page-subtitle" x-text="'Kubeconfig Manager v{{.Version}}'"></span>
      <div class="ml-auto flex gap-2">
        <button class="btn btn-ghost" @click="checkHealth()" title="Check all clusters">
          ⚡ Health check
        </button>
      </div>
    </div>

    <!-- Toolbar -->
    <div class="toolbar">
      <div class="filter-input">
        <span class="filter-icon">🔍</span>
        <input x-model="search" @input.debounce.200ms="loadContexts()" placeholder="Filter by name, cluster, server…" />
      </div>
      <label class="toggle-label">
        <input type="checkbox" x-model="pinnedOnly" @change="loadContexts()" />
        Pinned only
      </label>
      <span x-show="filterGroup || filterFile" style="font-size:12px;color:var(--accent)">
        Filtered ·
        <a @click="clearFilters()" style="cursor:pointer;text-decoration:underline">clear</a>
      </span>
      <span class="count-label" x-text="contexts.length + ' context' + (contexts.length !== 1 ? 's' : '')"></span>
    </div>

    <!-- Table -->
    <div class="table-card">
      <table>
        <thead>
          <tr>
            <th style="width:28px;padding-right:0"></th>
            <th @click="sortBy('name')">
              Name <span class="sort-icon" x-text="sortField==='name' ? (sortDir==='asc' ? '↑' : '↓') : '↕'"></span>
            </th>
            <th @click="sortBy('cluster')">
              Cluster <span class="sort-icon" x-text="sortField==='cluster' ? (sortDir==='asc' ? '↑' : '↓') : '↕'"></span>
            </th>
            <th>Namespace</th>
            <th>Group</th>
            <th>Cloud</th>
            <th @click="sortBy('lastUsed')">
              Last Used <span class="sort-icon" x-text="sortField==='lastUsed' ? (sortDir==='asc' ? '↑' : '↓') : '↕'"></span>
            </th>
            <th style="text-align:right">Actions</th>
          </tr>
        </thead>
        <tbody>
          <template x-for="c in sortedContexts" :key="c.name">
            <tr @click="openDetail(c)" :class="c.current ? 'current-row' : ''">
              <!-- Status dot -->
              <td style="padding-right:0;width:28px">
                <span class="indicator" :class="c.current ? 'current' : c.pinned ? 'pinned' : 'none'" title="current">
                  <span class="dot"></span>
                </span>
              </td>

              <!-- Name -->
              <td class="td-name">
                <span class="name-text" :title="c.name" x-text="c.name"></span>
                <span x-show="c.pinned" style="font-size:10px;color:var(--yellow);margin-left:4px">★</span>
              </td>

              <!-- Cluster -->
              <td class="td-mono" :title="c.cluster" x-text="c.cluster || '—'"></td>

              <!-- Namespace -->
              <td>
                <span x-show="c.namespace" class="badge badge-gray" x-text="c.namespace"></span>
                <span x-show="!c.namespace" class="td-dim">—</span>
              </td>

              <!-- Group -->
              <td>
                <span x-show="c.group" class="badge badge-blue" x-text="c.group"></span>
                <span x-show="!c.group" class="td-dim">—</span>
              </td>

              <!-- Cloud -->
              <td>
                <template x-if="c.cloudProvider">
                  <span class="cloud-chip">
                    <span x-text="cloudIcon(c.cloudProvider)"></span>
                    <span x-text="c.cloudProvider + (c.cloudRegion ? ' · ' + c.cloudRegion : '')"></span>
                  </span>
                </template>
                <span x-show="!c.cloudProvider" class="td-dim">—</span>
              </td>

              <!-- Last used -->
              <td class="td-dim" x-text="c.lastUsed ? fmtDate(c.lastUsed) : '—'"></td>

              <!-- Actions -->
              <td @click.stop>
                <div class="actions-cell">
                  <button class="btn btn-primary" @click="switchCtx(c.name)">Use</button>
                  <button class="btn-icon btn" @click="openDetail(c)" title="Details">···</button>
                </div>
              </td>
            </tr>
          </template>

          <!-- Empty state -->
          <tr x-show="sortedContexts.length === 0">
            <td colspan="8">
              <div class="empty-state">
                <div class="empty-icon">⎈</div>
                <p>No contexts match your filters.</p>
                <a @click="clearFilters(); search=''; loadContexts()">Clear all filters</a>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>
</div>

<!-- ── Detail drawer ────────────────────────────────────────────────────────── -->
<template x-if="selected">
  <div>
    <div class="drawer-overlay" @click="selected = null"></div>
    <div class="drawer">
      <div class="drawer-header">
        <div>
          <div class="drawer-title" x-text="selected.name"></div>
          <div class="drawer-subtitle">
            <span x-show="selected.current" class="badge badge-green" style="margin-right:4px">active</span>
            <span x-show="selected.pinned" class="badge badge-yellow" style="margin-right:4px">pinned</span>
            <span x-text="selected.source"></span>
          </div>
        </div>
        <button class="btn-icon btn" @click="selected = null">✕</button>
      </div>

      <div class="drawer-body">
        <!-- Connection -->
        <div class="field-group">
          <div class="field-group-title">Connection</div>
          <div class="field-row"><span class="field-key">Cluster</span><span class="field-val" x-text="selected.cluster || '—'"></span></div>
          <div class="field-row"><span class="field-key">User</span><span class="field-val" x-text="selected.user || '—'"></span></div>
          <div class="field-row"><span class="field-key">Server</span><span class="field-val truncate" :title="selected.server" x-text="selected.server || '—'"></span></div>
          <div class="field-row"><span class="field-key">Namespace</span><span class="field-val" x-text="selected.namespace || '(default)'"></span></div>
        </div>

        <!-- Metadata -->
        <div class="field-group">
          <div class="field-group-title">Metadata</div>
          <div class="field-row"><span class="field-key">Group</span><span class="field-val" x-text="selected.group || '—'"></span></div>
          <div class="field-row"><span class="field-key">Color</span><span class="field-val" x-text="selected.color || '—'"></span></div>
          <div class="field-row" x-show="selected.cloudProvider">
            <span class="field-key">Cloud</span>
            <span class="field-val" x-text="(selected.cloudProvider||'') + (selected.cloudRegion ? ' / '+selected.cloudRegion : '')"></span>
          </div>
          <div class="field-row" x-show="selected.lastUsed">
            <span class="field-key">Last used</span>
            <span class="field-val" x-text="selected.lastUsed ? fmtDateFull(selected.lastUsed) : '—'"></span>
          </div>
          <template x-if="selected.labels && Object.keys(selected.labels).length">
            <div class="field-row">
              <span class="field-key">Labels</span>
              <div class="field-val flex gap-2" style="flex-wrap:wrap">
                <template x-for="[k,v] in Object.entries(selected.labels)" :key="k">
                  <span class="badge badge-gray" x-text="k+'='+v"></span>
                </template>
              </div>
            </div>
          </template>
        </div>

        <!-- Edit group -->
        <div class="field-group">
          <div class="field-group-title">Set Group</div>
          <div class="inline-form">
            <input class="input" x-model="groupInput" placeholder="e.g. production" @keydown.enter="setGroup()" />
            <button class="btn btn-ghost" @click="setGroup()">Save</button>
          </div>
        </div>

        <!-- Health -->
        <div class="field-group" x-show="healthResult">
          <div class="field-group-title">Health</div>
          <div class="field-row">
            <span class="field-key">Status</span>
            <span :class="healthResult?.ok ? 'badge badge-green' : 'badge badge-red'"
                  x-text="healthResult?.ok ? 'Reachable' : 'Unreachable'"></span>
          </div>
          <div class="field-row" x-show="healthResult?.latency">
            <span class="field-key">Latency</span>
            <span class="field-val" x-text="healthResult?.latency"></span>
          </div>
          <div class="field-row" x-show="healthResult?.err">
            <span class="field-key">Error</span>
            <span class="field-val" style="color:var(--red);word-break:break-all" x-text="healthResult?.err"></span>
          </div>
        </div>
      </div>

      <div class="drawer-footer">
        <button class="btn btn-primary" style="width:100%" @click="switchCtx(selected.name)">
          ⎈ Switch to this context
        </button>
        <div class="flex gap-2">
          <button class="btn btn-ghost" style="flex:1" @click="promptRename()">✏️ Rename</button>
          <button class="btn btn-ghost" style="flex:1" @click="exportCtx(selected.name)">⬇️ Export</button>
          <button class="btn btn-ghost" @click="togglePin()"
                  :style="selected.pinned ? 'color:var(--yellow)' : ''">
            <span x-text="selected.pinned ? '★ Unpin' : '☆ Pin'"></span>
          </button>
        </div>
        <button class="btn btn-danger" style="width:100%;margin-top:4px"
                @click="deleteCtx(selected.name)">
          🗑 Delete context
        </button>
      </div>
    </div>
  </div>
</template>

<!-- ── Quick switcher modal ──────────────────────────────────────────────────── -->
<div class="modal-overlay" x-show="showSearch" x-cloak @click="showSearch = false">
  <div class="modal" @click.stop>
    <div class="modal-search">
      <span style="color:var(--text-muted)">🔍</span>
      <input x-ref="searchInput"
             x-model="quickSearch"
             @input="filterQuick()"
             @keydown.arrow-down.prevent="quickIdx = Math.min(quickIdx+1, quickResults.length-1)"
             @keydown.arrow-up.prevent="quickIdx = Math.max(quickIdx-1, 0)"
             @keydown.enter="quickSelect()"
             placeholder="Search contexts…" />
      <span class="kbd">ESC</span>
    </div>
    <div class="modal-results">
      <template x-for="(c, i) in quickResults" :key="c.name">
        <div class="modal-result"
             :class="{ highlighted: i === quickIdx }"
             @click="switchCtx(c.name); showSearch = false"
             @mouseenter="quickIdx = i">
          <span class="dot" style="width:7px;height:7px;border-radius:50%;flex-shrink:0"
                :style="c.current ? 'background:var(--green)' : 'background:var(--border)'"></span>
          <span class="result-name" x-text="c.name"></span>
          <span class="result-cluster" x-text="c.cluster"></span>
          <span x-show="c.group" class="badge badge-blue" style="font-size:10px" x-text="c.group"></span>
        </div>
      </template>
      <div class="modal-empty" x-show="quickResults.length === 0">
        No contexts found for "<span x-text="quickSearch"></span>"
      </div>
    </div>
    <div class="modal-footer">
      <span class="modal-hint"><span class="kbd">↑↓</span> navigate</span>
      <span class="modal-hint"><span class="kbd">↵</span> select</span>
      <span class="modal-hint"><span class="kbd">ESC</span> close</span>
    </div>
  </div>
</div>

<!-- ── Toast container ───────────────────────────────────────────────────────── -->
<div class="toast-container">
  <template x-for="t in toasts" :key="t.id">
    <div class="toast" :class="t.type" x-text="t.msg"></div>
  </template>
</div>

<script src="/static/app.js"></script>
</body>
</html>
